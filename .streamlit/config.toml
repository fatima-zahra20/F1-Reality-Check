[theme]
# ONE palette section, deliberately.
#
# Defining [theme.light] and [theme.dark] instead makes Streamlit follow the
# visitor's SYSTEM appearance and ignore `base`, so the app opened dark on a
# dark machine and the in-page switch could not override it. The switch in
# dashboard/theme.py rewrites these values at runtime instead, which keeps the
# app authoritative over its own default.
base = "light"
primaryColor = "#E10600"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#31333F"
font = "sans serif"

[server]
# The bundle is ~23 MB uncompressed and cached in memory per session.
maxUploadSize = 50
