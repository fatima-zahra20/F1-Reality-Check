name: f1-reality-check
channels:
  - defaults
dependencies:
  - python=3.13.9
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - statsmodels=0.14.5
  - scikit-learn=1.7.2
  - matplotlib
  - seaborn
  - requests
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      # Via pip rather than conda: the defaults channel does not carry duckdb.
      #
      # The exact version matters more than any other pin here. DuckDB's storage
      # format belongs to the release that wrote the file, and a reader from a
      # different release refuses to open it. This pin and the one in
      # requirements.txt are what guarantee the pipeline and Streamlit Cloud
      # agree about the bundle. Change both together.
      - duckdb==1.5.5
